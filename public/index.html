<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>HabaCoin Global Protocol</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css"> <meta name="theme-color" content="#27ae60">
    
    <script src="https://unpkg.com/matrix-js-sdk@34.3.0/dist/browser-matrix.min.js" defer></script>
    <script src="/matrix-login.js" defer></script>
</head>
<body>
    <div id="app">
        <h1>HabaCoin Global</h1>
        <div id="mining-status">Initializing Proof-of-Work Engine...</div>
    </div>

    <script type="module">
        // 1. Register the Hardened Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('[+] Service Worker registered safely:', reg.scope))
                    .catch(err => console.error('[-] Service Worker execution blocked:', err));
            });
        }

        // 2. Load and Instantiate the Compiled Rust WASM Miner
        import init, { start_mining } from '/wasm/miner_client.js';
        async function run() {
            try {
                await init();
                console.log("[+] Crypto WebAssembly Module Initialized.");
                // Invoke underlying Rust mining routines safely
                start_mining(); 
            } catch (err) {
                console.error("[-] Failed to load WASM worker structures:", err);
            }
        }
        run();
    </script>
</body>
</html>
