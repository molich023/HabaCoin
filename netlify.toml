[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  path = "/api/resolve-game"
  function = "resolve-game"

[[edge_functions]]
  path = "/api/ghost-config"
  function = "ghost-config"

# CRITICAL AUTOMATION: API Route Proxy Mirror
# Redirects all frontend network API dispatches safely to our core backend engine clusters
[[redirects]]
  from = "/api/*"
  to = "http://localhost:3000/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  
  

  
    
