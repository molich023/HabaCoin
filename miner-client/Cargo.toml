[package]
name = "habacoin-miner-client"
version = "1.0.0"
edition = "2021"
authors = ["HabaCoin Engineering Team"]
description = "High-performance Rust sPoW core worker engine for HabaCoin client runtimes."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.92" # Specified precise stable build target
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6" # Updated to match stable bindgen targets

[profile.release]
opt-level = "z"      
lto = true           
codegen-units = 1    
panic = "abort"      

