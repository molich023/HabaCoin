[package]
name = "habacoin-miner-client"
version = "1.0.0"
edition = "2021"
authors = ["HabaCoin Engineering Team"]
description = "High-performance Rust sPoW core worker engine for HabaCoin client runtimes."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"

# Advanced profile optimizations for extreme mobile compression
[profile.release]
opt-level = "z"      # Optimize purely for binary size footprint
lto = true           # Enable Link-Time Optimization across blocks
codegen-units = 1    # Reduce parallel compilation blocks to maximize optimization thresholds
panic = "abort"      # Remove heavy stack unwinding tracking elements

